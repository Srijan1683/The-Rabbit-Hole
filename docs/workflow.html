<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Rabbit Hole Workflow</title>
    <link rel="stylesheet" href="./workflow.css" />
  </head>
  <body>
    <main class="viewport">
      <section class="diagram-shell" id="diagramShell" aria-label="The Rabbit Hole technical workflow">
        <header class="diagram-header">
          <div>
            <p class="eyebrow">The Rabbit Hole</p>
            <h1>AI Agent Workflow</h1>
          </div>
          <div class="header-controls">
            <button class="reset-button" id="resetButton" type="button">Reset simulation</button>
            <div class="status-panel">
              <span class="status-dot"></span>
              <span id="statusText">initializing workflow trace</span>
            </div>
          </div>
        </header>

        <div class="board" id="board">
          <svg class="connections" id="connections" viewBox="0 0 1200 660" aria-hidden="true"></svg>
          <div class="lane-label lane-input">input</div>
          <div class="lane-label lane-core">agent workflow</div>
          <div class="lane-label lane-output">output</div>
          <div id="nodes"></div>
          <aside class="error-rail">
            <h2>handled failures</h2>
            <ul>
              <li>API rate limit</li>
              <li>429 retry + jitter</li>
              <li>Malformed API response</li>
              <li>Model rate limit</li>
              <li>Client disconnect</li>
              <li>Database startup failure</li>
            </ul>
          </aside>
          <aside class="trace-panel">
            <h2>trace</h2>
            <ol id="traceList"></ol>
          </aside>
        </div>
      </section>
    </main>

    <script src="./workflow.js"></script>
  </body>
</html>
